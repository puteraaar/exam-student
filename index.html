<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Student - PSAS 2026</title>
    <link rel="icon" type="image/x-icon" href="logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <main class="bg-fuchsia-50">
        <section id="hero-section" class="py-8 bg-fuchsia-100">
            <!-- Container Hero -->
            <div class="max-w-4xl mx-auto flex flex-col text-center items-center justify-center">
                <div class="relative w-30 h-30 rounded-full border border-blue-200 p-1 mb-4">
                    <div class="rounded-full overflow-hidden w-full h-full">
                        <img src="logo.png" alt="" class="object-cover w-full h-full">
                    </div>
                    <span class="absolute bottom-0 right-10 transform translate-x-1/4 translate-y-1/2 bg-amber-800 text-white text-xs font-semibold px-1 py-0.5 rounded-full border-2 border-white">SMA ABBS</span>
                </div>
                <h1 class="font-bold text-3xl text-indigo-950 mb-2.5">Selamat datang di halaman tautan PSAS! 🎉</h1>
                <p class="text-gray-500 mb-4 w-100">Kumpulan link dan jadwal untuk persiapan Penilaian Sumatif Akhir Semester (PSAS)</p>

                <div class="flex gap-2 border border-gray-300 rounded-full px-2 py-0.5 text-sm items-center w-50 mx-auto justify-center">
                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-book"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6l0 13" /><path d="M12 6l0 13" /><path d="M21 6l0 13" /></svg>
                    <span>Semester Genap 2026</span>
                </div>
            </div>
        </section>

        <section id="link-section" class="py-8">
            <div class="max-w-4xl mx-auto pb-8">
                <div class="text-center mb-8">
                    <h1 class="font-bold text-2xl text-indigo-950 mb-2.5">Link Ujian Siswa</h1>
                    <p class="text-gray-500">Klik link di bawah untuk mengakses persiapan ujian</p>
                </div>

                <div id="link-container" class="flex flex-col gap-5 px-4 md:px-0">
                    <!-- Isi link otomatis -->
                </div>
            </div>
        </section>
    </main>
    <footer class="p-6 text-center">
        <p class="text-sm text-gray-500">© 2025 Tim IT SMA ABBS SUKOHARJO ❤️</p>
    </footer>

    <script>
        const links = [
            {
                title: "Download File Ujian SEB",
                description: "Download File Ujian di sini",
                url: "https://drive.google.com/uc?export=download&id=1vX-fjPnKxDTYHQAMYAX9idnXSKa7-ytG",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-pin"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15.113 3.21l.094 .083l5.5 5.5a1 1 0 0 1 -1.175 1.59l-3.172 3.171l-1.424 3.797a1 1 0 0 1 -.158 .277l-.07 .08l-1.5 1.5a1 1 0 0 1 -1.32 .082l-.095 -.083l-2.793 -2.792l-3.793 3.792a1 1 0 0 1 -1.497 -1.32l.083 -.094l3.792 -3.793l-2.792 -2.793a1 1 0 0 1 -.083 -1.32l.083 -.094l1.5 -1.5a1 1 0 0 1 .258 -.187l.098 -.042l3.796 -1.425l3.171 -3.17a1 1 0 0 1 1.497 -1.26z" /></svg>',
                target: "_self"
            },
            {
                title: "Jadwal Ujian",
                description: "Informasi terkini seputar jadwal ujian",
                url: "jadwal.html",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-clock-hour-7"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 12l-2 3" /><path d="M12 7v5" /></svg>',
                target: "_self"
            },
            {
                title: "Tata Tertib Siswa",
                description: "Baca terlebih dahulu peraturan selama ujian",
                url: "tata-tertib.html",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-exclamation"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4c.348 0 .686 .045 1.008 .128" /><path d="M19 16v3" /><path d="M19 22v.01" /></svg>',
                target: "_self"
            },
            {
                title: "Kisi-kisi PSAS",
                description: "Akses kisi-kisi pelajaran yang diujikan",
                url: "https://drive.google.com/drive/folders/1ES7q5UskeMrDSsFCFRZqRUrWjUclOQIJ",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-notes"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 3m0 2a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z" /><path d="M9 7l6 0" /><path d="M9 11l6 0" /><path d="M9 15l4 0" /></svg>',
                target: "_blank"
            },
            {
                title: "Download SEB Windows dan MacOS",
                description: "Unduh aplikasi Ujian SEB untuk OS Windows dan MacOS",
                url: "https://safeexambrowser.org/download_en.html",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-download"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>',
                target: "_self"
            },
            {
                title: "Download .NET Framework 3.5",
                description: "Unduh aplikasi berikut jika SEB tidak berhasil diinstall",
                url: "https://dotnet.microsoft.com/en-us/download/dotnet-framework/net35-sp1",
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-brand-windows"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M21 13v5c0 1.57 -1.248 2.832 -2.715 2.923l-.113 .003l-.042 .018a1 1 0 0 1 -.336 .056l-.118 -.008l-4.676 -.585v-7.407zm-10 0v7.157l-5.3 -.662c-1.514 -.151 -2.7 -1.383 -2.7 -2.895v-3.6zm0 -9.158v7.158h-8v-3.6c0 -1.454 1.096 -2.648 2.505 -2.87zm10 2.058v5.1h-8v-7.409l4.717 -.589c1.759 -.145 3.283 1.189 3.283 2.898" /></svg>',
                target: "_self"
            }
        ]

        // Fungsi untuk membuat elemen tautan
        function createLinkElement(link) {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = link.target;
            a.className = "bg-white p-6 rounded-xl shadow-sm flex items-center justify-between group hover:-translate-y-1 duration-300 hover:shadow-lg hover:shadow-fuchsia-100";

            // Tanda panah eksternal (menggunakan ikon yang sama untuk semua link)
            const externalLinkIcon = `
                <div class="text-gray-500 group-hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-external-link">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" />
                        <path d="M11 13l9 -9" />
                        <path d="M15 4h5v5" />
                    </svg>
                </div>
            `;

            // Konten link (Icon dan Teks)
            a.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="bg-blue-100 text-blue-500 rounded-lg p-2 group-hover:bg-blue-200 group-hover:text-blue-600">
                        ${link.iconSvg}
                    </div>
                    
                    <div>
                        <h1 class="font-semibold text-lg text-gray-800 group-hover:text-blue-600">${link.title}</h1>
                        <p class="text-sm text-gray-500">${link.description}</p>
                    </div>
                </div>
                ${externalLinkIcon}
            `;

            return a
        }

        // Fungsi utama untuk me-render semua tautan
        function renderLinks() {
            const container = document.getElementById('link-container');
            if (container) {
                links.forEach(link => {
                    const linkElement = createLinkElement(link);
                    container.appendChild(linkElement);
                });
            }
        }

        // Panggil fungsi render setelah DOM dimuat
        document.addEventListener('DOMContentLoaded', renderLinks);
    </script>
</body>
</html>
